<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('pic.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #e9e7e0;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            width: 750px;
            max-width: 90%;
        }
        .login-info {
            flex: 1;
            padding: 20px;
        }
        .login-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-image img {
            width: 300px;
            height: auto;
            border-radius: 10px;
        }
        h1 {
            color: #000000;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
            color: #000000;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #a72218;
            border-radius: 6px;
            background: #e3c5b2;
            color: #000000;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #a72218;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease-in-out;
        }
        button:hover {
            background: #8c1c13;
        }
        .links {
            text-align: center;
            margin-top: 15px;
        }
        .links a {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #000000;
            font-weight: bold;
            font-size: 14px;
            padding: 8px;
            background: #a72218;
            border-radius: 6px;
            transition: background 0.3s ease-in-out;
        }
        .links a:hover {
            background: #8c1c13;
            color: white;
        }
        .message {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            color: green;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-info">
            <h1>Login</h1>
            <form id="loginForm">
                <label for="aadhar">Aadhar Number:</label>
                <input type="text" name="aadhar" id="aadhar" required
                    pattern="\d{12}" 
                    title="Aadhar number must be exactly 12 digits"
                    minlength="12" maxlength="12"
                    inputmode="numeric"
                />

                <label for="password">Password:</label>
                <input type="password" name="password" id="password" required
                    minlength="8"
                    pattern="^[A-Za-z]{5}\d{3}$"
                    title="Password must be at least 8 characters long (5 letters and 3 digits)"
                />
                
                <!-- Show Password Checkbox -->
                <input type="checkbox" id="showPassword"> Show Password
                
                <br />
                <button type="submit">Login</button>
                <p class="message" id="message"></p>

             <!-- <div class="links">
                    <button type="button" onclick="location.href='registration.html'">Register</button>
                </div>
                -->  
            </form>
        </div>
        <div class="login-image">
            <img src="static/loginImg.jpg" alt="Digital Voting Image" />
        </div>
    </div>

    <!-- JavaScript for Show/Hide Password & Login Functionality -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent form from refreshing
    
            let aadhar = document.getElementById('aadhar').value;
            let password = document.getElementById('password').value;
            let message = document.getElementById('message');
    
            let response = await fetch('http://localhost:5000/api/login', { // Corrected API Endpoint
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ aadhar: aadhar, password: password })
            });
    
            let data = await response.json();
    
            if (response.ok) {
                message.style.color = "green";
                message.textContent = "Login successful!";
                setTimeout(() => {
                    window.location.href = "login"; // Redirect after successful login
                }, 2000);
            } else {
                message.style.color = "red";
                message.textContent = data.error || "Invalid login!";
            }
        });
    </script>
</body>
</html>
