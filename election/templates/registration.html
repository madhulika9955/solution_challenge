<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: url('register.jpg') no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #ffb584;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #a72218;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #891812;
        }
        .message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Register</h1>
        <form id="registerForm">
            <label for="name">Name:</label>
            <input type="text" id="name" required>

            <label for="age">Age:</label>
            <input type="number" id="age" required>

            <label for="sex">Sex:</label>
            <select id="sex" required>
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="phone_number">Phone Number:</label>
            <input type="tel" id="phone_number" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="voter_id">Voter ID:</label>
            <input type="text" id="voter_id" required>

            <label for="aadhar_number">Aadhar Number:</label>
            <input type="text" id="aadhar_number" required>

            <label for="address">Address:</label>
            <textarea id="address" required></textarea>

            <label for="password">Create Password:</label>
            <input type="password" id="password" required>

            <button type="submit">Register</button>
        </form>

        <p class="message" id="message"></p>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            let formData = {
                name: document.getElementById("name").value,
                age: document.getElementById("age").value,
                sex: document.getElementById("sex").value,
                phone_number: document.getElementById("phone_number").value,
                email: document.getElementById("email").value,
                voter_id: document.getElementById("voter_id").value,
                aadhar_number: document.getElementById("aadhar_number").value,
                address: document.getElementById("address").value,
                password: document.getElementById("password").value
            };

            let response = await fetch("/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            });

            let result = await response.json();
            document.getElementById("message").textContent = result.message || result.error;
        });
    </script>

</body>
</html>
