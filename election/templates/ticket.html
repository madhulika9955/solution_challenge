<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Ticket Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Color Palette */
        :root {
            --primary-color: #a72218;
            --background-color: #eb6f46;
            --container-color: #fdb284;
            --input-bg: #e3c5b2;
            --text-color: #010101;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
             background: url('static/ticket.jpg') no-repeat center center/cover;
            color: var(--text-color);
        }

        .container {
            width: 30rem;
            padding: 1.5rem;
            border-radius: 0.35rem;
            background-color: var(--container-color);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2, h3 {
            color: var(--text-color);
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: 1px solid var(--primary-color);
            border-radius: 0.25rem;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        .error-message {
            color: red;
            font-size: 12px;
            text-align: left;
            margin-bottom: 5px;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            margin-top: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 0.25rem;
            font-size: 16px;
        }

        
        

        /* Modal for QR Code */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--container-color);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 18px;
            cursor: pointer;
            color: red;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Voting Ticket Generator</h2>
        <form id="ticketForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <div class="error-message" id="nameError"></div>

            <label for="voterID">Voter ID</label>
            <input type="text" id="voterID" placeholder="Enter your Voter ID (8-digit alphanumeric)" required>
            <div class="error-message" id="voterIDError"></div>

            <label for="party">Select Party</label>
            <select id="party" required>
                <option value="">-- Select --</option>
                <option value="Party A">Party A</option>
                <option value="Party B">Party B</option>
                <option value="Party C">Party C</option>
            </select>

            <button type="submit" class="btn">Generate Ticket</button>
        </form>
    </div>

    <!-- Modal for QR Code -->
    <div class="modal" id="qrModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>Your Voting Ticket</h3>
            <p><strong>Name:</strong> <span id="ticketName"></span></p>
            <p><strong>Voter ID:</strong> <span id="ticketVoterID"></span></p>
            <p><strong>Party:</strong> <span id="ticketParty"></span></p>
            <div id="qrcode"></div>
            <button onclick="downloadTicket()" class="btn">Download Ticket</button>
        </div>
    </div>

    <script>
        document.getElementById("ticketForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent form submission

            const name = document.getElementById("name").value.trim();
            const voterID = document.getElementById("voterID").value.trim();
            const party = document.getElementById("party").value.trim();
            let isValid = true;

            // Reset errors
            document.getElementById("nameError").innerText = "";
            document.getElementById("voterIDError").innerText = "";

            // Name Validation: Only Alphabets Allowed
            if (!/^[A-Za-z\s]+$/.test(name) || name.length < 3) {
                document.getElementById("nameError").innerText = "Name must be at least 3 letters & contain only alphabets!";
                isValid = false;
            }

            // Voter ID Validation: 8-Digit Alphanumeric
            if (!/^[A-Za-z0-9]{8}$/.test(voterID)) {
                document.getElementById("voterIDError").innerText = "Voter ID must be 8 alphanumeric characters!";
                isValid = false;
            }

            if (!isValid) return;

            // Display ticket info in modal
            document.getElementById("ticketName").innerText = name;
            document.getElementById("ticketVoterID").innerText = voterID;
            document.getElementById("ticketParty").innerText = party;

            // Show Modal
            document.getElementById("qrModal").style.display = "flex";

            // Generate QR Code
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: `Name: ${name}\nVoter ID: ${voterID}\nParty: ${party}`,
                width: 150,
                height: 150
            });
        });

        // Close Modal
        function closeModal() {
            document.getElementById("qrModal").style.display = "none";
        }

        // Download Ticket as Image
        function downloadTicket() {
            const modalContent = document.querySelector(".modal-content");
            html2canvas(modalContent).then(canvas => {
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "Voting_Ticket.png";
                link.click();
            });
        }

        // Close modal if clicked outside
        window.onclick = function(event) {
            const modal = document.getElementById("qrModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };
    </script>

</body>
</html>
